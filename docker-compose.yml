version: "3.9"

services:
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # OpenClaw in Docker must call Ollama running on macOS via the Docker host bridge.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
    volumes:
      # Persist OpenClaw state/config in the user's home directory (outside this repo).
      - ${OPENCLAW_DATA_DIR}:/app/data
